[project]
name = "captcha-recognizer"
version = "1.0.0"
description = "Convolutional network that reads five-character captcha images"
requires-python = ">=3.10"
dependencies = [
    "keras>=3.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
captcha-recognizer = "captcha_recognizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["captcha_recognizer*"]
